[pytest]
testpaths = tests
asyncio_mode = auto
addopts = --assert=plain
markers =
    unit: Isolated fast unit tests with no external dependencies
    api: API and router endpoint tests using FastAPI TestClient
    ml: Machine learning model and embedding evaluation tests
    integration: Subsystem and multi-service integration tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
